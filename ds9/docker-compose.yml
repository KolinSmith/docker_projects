version: '3.8'

services:
  pihole:
    container_name: pihole-ds9
    image: pihole/pihole:latest
    hostname: ds9
    ports:
      - "53:53/tcp"      # DNS TCP
      - "53:53/udp"      # DNS UDP
      - "80:80/tcp"      # Web interface (HTTP)
      # - "443:443/tcp"  # Web interface (HTTPS) - uncomment if needed
    environment:
      TZ: 'America/Chicago'

      # Web password (plaintext for Pi-hole v6 - set in .env)
      WEBPASSWORD: '${PIHOLE_WEBPASSWORD}'

      # Upstream DNS servers (set in .env)
      PIHOLE_DNS_: '${PIHOLE_UPSTREAM_DNS}'

      DNSSEC: 'true'

      # Reverse DNS server settings (set in .env)
      REV_SERVER: 'true'
      REV_SERVER_CIDR: '${PIHOLE_REV_SERVER_CIDR}'
      REV_SERVER_TARGET: '${PIHOLE_REV_SERVER_TARGET}'
      REV_SERVER_DOMAIN: '${PIHOLE_REV_SERVER_DOMAIN}'

      FTLCONF_MAXDBDAYS: '10000'

      VIRTUAL_HOST: '${PIHOLE_VIRTUAL_HOST}'

      # Required on ARM: FTL can't use CAP_SETFCAP with no-new-privileges; run dnsmasq as root
      DNSMASQ_USER: 'root'

      # Allow queries from non-local (non-Docker-bridge) networks like 192.168.9.x
      FTLCONF_DNS_LISTENINGMODE: 'all'

      # Pi-hole v6 defaults to NOT reading /etc/dnsmasq.d/ — enable it so custom DNS overrides load
      FTLCONF_misc_etc_dnsmasq_d: 'true'

    volumes:
      - './etc-pihole:/etc/pihole'
      # Custom DNS overrides — file lives in ~/docker_data/ds9/ (deployed by Ansible)
      - '../docker_data/ds9/03-dns-overrides.conf:/etc/dnsmasq.d/03-dns-overrides.conf:ro'

    dns:
      - 127.0.0.1
      - '${PIHOLE_UPSTREAM_DNS}'

    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    networks:
      - pihole_network

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host

    environment:
      PORT: 45876
      KEY: "${BESZEL_AGENT_KEY}"

    volumes:
      - ./beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - SYS_PTRACE
      - NET_ADMIN

networks:
  pihole_network:
    driver: bridge
