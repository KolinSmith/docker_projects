# Samba: print sharing only. No file shares, no [homes].
# Windows clients print via \\printserver\Brother_Printer (guest, no login) or
# add it by IPP at http://printserver:631/printers/Brother_Printer.

[global]
   workgroup = WORKGROUP
   server string = printserver
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody

   # host networking: bind all interfaces
   dns proxy = no
   disable netbios = no

   # modern clients only
   server min protocol = SMB2
   client min protocol = SMB2

   logging = stdout
   log level = 0

   # printing backend
   load printers = yes
   printing = cups
   printcap name = cups
   disable spoolss = no
   show add printer wizard = no

   # provision-queue.sh writes an explicit [<queue>] stanza here after it
   # creates the CUPS queue (the bare [printers] auto-share can be flaky in a
   # minimal container). Empty placeholder ships in the image.
   include = /etc/samba/smb.conf.d/printer.conf

[printers]
   comment = Print queues
   path = /var/spool/samba
   browseable = no
   public = yes
   guest ok = yes
   printable = yes
   read only = yes
   create mask = 0700

[print$]
   comment = Printer drivers
   path = /var/lib/samba/printers
   browseable = yes
   guest ok = yes
   read only = yes
