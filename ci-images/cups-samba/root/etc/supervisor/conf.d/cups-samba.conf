; supervisord runs as PID 1 (see entrypoint.sh). It starts the print-server
; daemons and restarts any that crash. Logs go straight to the container's
; stdout/stderr so `docker logs` shows everything.
;
; avahi and cupsd wait for the D-Bus system socket before starting (cupsd needs
; it for DNS-SD/AirPrint registration via Avahi).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avahi]
command=/bin/sh -c "until [ -S /run/dbus/system_bus_socket ]; do sleep 0.5; done; exec /usr/sbin/avahi-daemon --no-chroot -f /etc/avahi/avahi-daemon.conf"
priority=20
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cupsd]
command=/bin/sh -c "until [ -S /run/dbus/system_bus_socket ]; do sleep 0.5; done; exec /usr/sbin/cupsd -f"
priority=30
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:smbd]
command=/usr/sbin/smbd --foreground --no-process-group --debug-stdout
priority=40
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nmbd]
command=/usr/sbin/nmbd --foreground --no-process-group --debug-stdout
priority=40
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wsdd]
command=/usr/sbin/wsdd2 -G WORKGROUP
priority=50
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: waits for cupsd, then adds the print queue from the PRINTER_* env
; vars if it isn't already defined. Exits 0 either way.
[program:provision-queue]
command=/usr/local/bin/provision-queue.sh
priority=60
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
