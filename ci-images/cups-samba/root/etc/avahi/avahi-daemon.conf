# Avahi for the container. Host networking, so it advertises on the LAN using
# the host's hostname (printserver). CUPS registers its shared printers through
# Avahi's D-Bus interface for AirPrint / Bonjour discovery.
#
# NOTE: the host OS must NOT also run avahi-daemon (port 5353 clash) — the
# Ansible provisioning masks it on printserver.

[server]
use-ipv4=yes
use-ipv6=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no
publish-addresses=yes
