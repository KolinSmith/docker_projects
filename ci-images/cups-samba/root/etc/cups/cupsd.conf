# cupsd.conf for the containerised print server.
#
# Host networking: listen on all interfaces. Access is left open at the CUPS
# layer (any host may print and reach the web UI) and restricted at the
# network edge by pfSense rules (MAIN -> 192.168.9.11 tcp/631, tcp/445, tcp/139).
# Admin operations still require the CUPS_ADMIN_USER / CUPS_ADMIN_PASSWORD login.

LogLevel warn
PageLogFormat
MaxLogSize 1m
ErrorLog stderr
AccessLog stderr
PreserveJobHistory Yes
PreserveJobFiles 1d

# Idle timeout: never exit (supervisord owns the lifecycle)
Timeout 300
WebInterface Yes

Listen *:631
Listen /run/cups/cups.sock

# Accept any Host: header (clients reach this box as printserver,
# 192.168.9.11, printserver.internal.homelab.gg, ...). LAN-only, edge-filtered.
ServerAlias *

# Advertise shared printers over DNS-SD (Avahi) for AirPrint / Bonjour
Browsing On
BrowseLocalProtocols dnssd
DefaultShared Yes

DefaultAuthType Basic
HostNameLookups Off

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
