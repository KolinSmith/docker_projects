name: monitoring

services:

  beszel-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: beszel-socket-proxy
    restart: unless-stopped
    read_only: true

    tmpfs:
      - /run

    ports:
      - "127.0.0.1:2375:2375"

    environment:
      CONTAINERS: 1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host

    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/henrygd/beszel/main/internal/site/public/static/icon.png"

    depends_on:
      - beszel-socket-proxy

    environment:
      PORT: 45876
      KEY: "${BESZEL_AGENT_KEY}"
      DOCKER_HOST: tcp://127.0.0.1:2375

    volumes:
      - /mnt/user/appdata/beszel-agent:/var/lib/beszel-agent
      - /:/host:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - SYS_PTRACE
      - NET_ADMIN
