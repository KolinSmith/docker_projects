name: monitoring_stack

services:

  beszel-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: beszel-socket-proxy
    restart: unless-stopped
    read_only: true

    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f50c.png"

    tmpfs:
      - /run

    ports:
      - "127.0.0.1:2375:2375"

    environment:
      CONTAINERS: 1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host

    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/henrygd/beszel/main/internal/site/public/static/icon.png"

    depends_on:
      - beszel-socket-proxy

    environment:
      PORT: 45876
      KEY: "${BESZEL_AGENT_KEY}"
      DOCKER_HOST: tcp://127.0.0.1:2375

    volumes:
      - /mnt/disks/appdataAndDocker/appdata/beszel-agent:/var/lib/beszel-agent
      - /:/host:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - SYS_PTRACE
      - NET_ADMIN

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true  # cgroup/Docker introspection needs real host access -- cap_add
                       # alone isn't sufficient for this image; documented exception to
                       # the cap_drop pattern, same class as hermes/hawser elsewhere.

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    ports:
      - "8081:8080"  # host 8080 is already binhex-sabnzbd -- confirmed via `ss -tlnp`
                      # on Borg before writing this plan; container's own internal port
                      # stays 8080, only the host-side mapping moves to 8081

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_GPU_UUID}"
      NVIDIA_DRIVER_CAPABILITIES: all

    ports:
      - "9835:9835"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
