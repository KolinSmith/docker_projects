global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      # Pre-existing native node_exporter on Borg itself -- NOT a Compose service name,
      # since it isn't a container in this project. Real LAN IP, confirmed reachable
      # from inside this project's bridge network in Task 2 Step 3.
      - targets: ['192.168.9.7:9100']

  - job_name: 'cadvisor'
    static_configs:
      # Container-internal port (8080) -- same Compose network, not the host-side 8081
      # mapping from Task 2 (that's only for curl-from-the-host access).
      - targets: ['cadvisor:8080']

  - job_name: 'nvidia-gpu-exporter'
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']

  - job_name: 'apc-ups'
    metrics_path: /snmp
    params:
      module: [apc_ups]
    static_configs:
      # Confirmed: prom/prometheus v2.54.1's own config file does NOT support
      # ${VAR}-style substitution the way Compose files do (checked the upstream
      # configuration docs for this version -- no env var expansion for
      # prometheus.yml). UPS_SNMP_HOST therefore can't be templated in from .env
      # here; written as a literal instead. This is a static LAN target, not a
      # secret -- the AP9630 card's real IP, matches UPS_SNMP_HOST in .env.example.
      # The actual secret (the SNMP community string) lives in snmp.yml's own
      # auth config instead, not here.
      - targets:
          - '192.168.9.51'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
