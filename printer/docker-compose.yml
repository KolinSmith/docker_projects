services:
  cups:
    # Custom image: CUPS + Avahi + Samba + wsdd (ci-images/cups-samba/).
    # Built by .forgejo/workflows/build-cups-samba-image.yml.
    image: 100.86.4.29:3001/dax/docker_projects/cups-samba:latest
    container_name: cups
    restart: unless-stopped
    # host networking so IPP :631, mDNS/AirPrint :5353, and SMB/NetBIOS/WS-D
    # (445/139/137/138/3702) are reachable on the LAN without NAT
    network_mode: host
    # supervisord is PID 1 but is not a full init; give it real zombie reaping
    init: true
    environment:
      TZ: America/Chicago
      CUPS_ADMIN_USER: "${CUPS_ADMIN_USER:-print}"
      CUPS_ADMIN_PASSWORD: "${CUPS_ADMIN_PASSWORD}"
      # declarative queue — the image adds it on first start if absent
      PRINTER_NAME: "${PRINTER_NAME:-Brother_Printer}"
      PRINTER_URI: "${PRINTER_URI}"
      PRINTER_PPD: "${PRINTER_PPD:-drv:///brlaser.drv/brl2320d.ppd}"
    volumes:
      - ./cups:/etc/cups            # persistent queue config + PPDs
    devices:
      - /dev/bus/usb:/dev/bus/usb   # Brother HL-L2320D over USB
    # no `security_opt: no-new-privileges` here: Samba's setuid helpers and
    # CUPS filter spawning need it off (same reason the pihole container drops
    # it on ARM). The container is single-purpose on an isolated VLAN.
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512
        reservations:
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  beszel-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: beszel-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    user: "1000:1000"  # `dax` on the provisioned box; keep in sync with Ansible
    tty: false
    stdin_open: false
    network_mode: host
    depends_on:
      - beszel-socket-proxy
    environment:
      PORT: 45876
      KEY: "${BESZEL_AGENT_KEY}"
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /:/host:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - SYS_PTRACE
      - NET_ADMIN
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
