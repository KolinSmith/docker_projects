name: Build CI image

on:
  push:
    branches:
      - master
    paths:
      - 'ci-images/ci-tools/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# The registry login uses the per-run token instead of a hand-made
# secrets.FORGEJO_TOKEN (which expired and broke every build — a ~50s failure
# at `docker login`, not a build problem). `packages: write` lets ${{ github.token }}
# push to this repo's own packages (ci-tools / cups-samba).
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ci-tools image
    runs-on: linux
    container:
      image: cgr.dev/chainguard/wolfi-base:latest
    steps:
      - name: Install dependencies
        run: apk add --no-cache docker-cli docker-cli-buildx git nodejs

      - uses: actions/checkout@v4

      - name: Log in to the container registry
        run: |
          echo "${{ github.token }}" | docker login 100.86.4.29:3001 \
            -u "${{ github.repository_owner }}" --password-stdin \
          || { echo "::error::registry login failed - the Actions token lacks package:write on this instance (or the registry is unreachable). See README ## CI."; exit 1; }

      - name: Build and push
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          REGISTRY=100.86.4.29:3001/dax/docker_projects/ci-tools
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)

          # Always tag :latest and :sha-XXXXXXX
          TAGS="-t ${REGISTRY}:latest -t ${REGISTRY}:sha-${SHA_SHORT}"

          # On semver tag push (v1.2.3), also tag :vX.Y.Z, :X.Y.Z, :X.Y, :X
          if echo "$REF" | grep -q '^refs/tags/v'; then
            V="${REF_NAME}"
            V_NOPREFIX="${V#v}"
            MINOR="${V_NOPREFIX%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS -t ${REGISTRY}:${V} -t ${REGISTRY}:${V_NOPREFIX} -t ${REGISTRY}:${MINOR} -t ${REGISTRY}:${MAJOR}"
          fi

          # provenance/sbom disabled: buildx's default attestation manifests
          # trigger a 401 on the blob HEAD check when pushing to this
          # registry over plain HTTP - confirmed deterministic (not
          # transient) via two identical failures on 2026-07-12.
          docker buildx build --push --provenance=false --sbom=false $TAGS ci-images/ci-tools/

          if echo "$REF" | grep -q '^refs/tags/v'; then
            docker buildx build --push --provenance=false --sbom=false \
              -t ${REGISTRY}:${V} \
              -t ${REGISTRY}:${V_NOPREFIX} \
              -t ${REGISTRY}:${MINOR} \
              -t ${REGISTRY}:${MAJOR} \
              ci-images/ci-tools/
          fi
